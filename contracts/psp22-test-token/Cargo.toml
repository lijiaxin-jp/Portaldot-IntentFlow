[package]
name = "intentflow_psp22_test_token"
version = "0.1.0"
authors = ["IntentFlow contributors"]
edition = "2021"
publish = false

[dependencies]
ink = { version = "5.1.1", default-features = false }
intentflow-contract-interface = { path = "../p2-interface", default-features = false }

[lib]
name = "intentflow_psp22_test_token"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["ink/std", "intentflow-contract-interface/std"]
ink-as-dependency = []

