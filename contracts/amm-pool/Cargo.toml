[package]
name = "intentflow_amm_pool"
version = "0.1.0"
authors = ["IntentFlow contributors"]
edition = "2021"
publish = false

[dependencies]
ink = { version = "5.1.1", default-features = false }
intentflow-contract-interface = { path = "../p2-interface", default-features = false }
ruint = { version = "1.20.0", default-features = false }

[lib]
name = "intentflow_amm_pool"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["ink/std", "intentflow-contract-interface/std", "ruint/std"]
ink-as-dependency = []

